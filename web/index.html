<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruki · BanglaVoice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230f7b5f'/%3E%3Ccircle cx='14' cy='16' r='7' fill='%23d6453d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // apply a saved theme before the first paint (no flash of the wrong theme)
    try { const t = localStorage.getItem("bv-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo avatar ruki" aria-hidden="true"><span>R</span></span>
      <div>
        <h1>Ruki</h1>
        <p class="sub">Real-time Bangla voice assistant</p>
      </div>
    </div>
    <div class="top-right">
      <div class="chips" id="chips"></div>
      <button id="themeSwitch" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode">
        <span class="knob">
          <svg viewBox="0 0 24 24" class="sun" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="moon" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
        </span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <button id="orb" class="orb" data-state="idle" aria-label="Start conversation">
        <span class="halo"><span class="g"></span><span class="r"></span></span>
        <span class="core">
          <svg viewBox="0 0 24 24" class="icon-mic" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4.5M8.5 21.5h7"/></svg>
          <svg viewBox="0 0 24 24" class="icon-stop" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </span>
        <span class="glow"><span class="g"></span><span class="r"></span></span>
        <span class="ring"><span class="g"></span><span class="r"></span></span>
      </button>
      <div class="state" id="stateLabel">Tap the microphone to start</div>
      <div class="hint" id="hint">Interrupting Ruki mid-sentence works best with headphones.</div>

      <div class="controls">
        <label>Voice
          <select id="voice"></select>
        </label>
        <label>Quality (steps)
          <select id="steps">
            <option value="8">8 — fastest</option>
            <option value="12">12 — fast</option>
            <option value="16" selected>16 — balanced</option>
            <option value="32">32 — best</option>
          </select>
        </label>
        <label class="toggle">
          <input type="checkbox" id="interrupt" checked>
          <span>Allow interruptions</span>
        </label>
      </div>
      <div class="buttons">
        <button id="stopTalk" class="ghost" disabled>Stop speaking</button>
        <button id="reset" class="ghost">New conversation</button>
      </div>
    </section>

    <section class="chat">
      <div class="log" id="log">
        <div class="empty" id="empty">No conversation yet. Tap the microphone and Ruki will greet you.</div>
      </div>
      <form class="composer" id="composer">
        <input id="textIn" type="text" placeholder="Or type a message…" autocomplete="off" disabled>
        <button type="submit" id="send" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
